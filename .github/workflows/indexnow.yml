# Tells Bing (and the other IndexNow engines) to re-crawl the site after each
# Pages deploy, instead of waiting for it to come round on its own.
# The key file at the site root (42ecc39ff2196a4754c698e7e0134ecc.txt) proves we own the domain.
#
# Triggered on push, not on the Pages deploy itself: the built-in
# "pages build and deployment" workflow does not fire workflow_run events.
# So the job waits for this commit's Pages build before pinging.
name: IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit's Pages build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            read -r status commit < <(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"\(.status) \(.commit)"')
            echo "attempt $i: $status $commit"
            if [ "$commit" = "${{ github.sha }}" ] && [ "$status" = "built" ]; then exit 0; fi
            sleep 10
          done
          echo "Pages build not confirmed after 5 minutes; pinging anyway."

      - name: Submit URLs
        run: |
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "musicforrobots.com",
              "key": "42ecc39ff2196a4754c698e7e0134ecc",
              "keyLocation": "https://musicforrobots.com/42ecc39ff2196a4754c698e7e0134ecc.txt",
              "urlList": [
                "https://musicforrobots.com/",
                "https://musicforrobots.com/press/",
                "https://musicforrobots.com/llms.txt"
              ]
            }' -w '\nHTTP %{http_code}\n'
